# NAR-VAE Population-Level Supervised Fine-Tuning (SFT) Configuration
# Continue a pretrained model on a multi-speaker dataset. This is not a recipe
# for teaching or adapting to one requested voice; see docs/post_pretraining.md.

training_stage: "sft"
seed: 1337
data_seed: 1337

# ============================================================================
# Pretrained Model
# ============================================================================

pretrained_checkpoint: null  # Fresh SFT requires a local, lineage-bearing NAR-VAE weight file.
resume_from_checkpoint: null  # true, or save_folder/checkpoint-N from this exact SFT run.

# ============================================================================
# Fine-tuning Strategy
# ============================================================================

# Layer freezing options
freeze_text_encoder: false     # Keep the small adapter trainable; frozen backbone is external.
freeze_speaker_encoder: false  # Required when initializing speaker conditioning
freeze_first_n_layers: 0       # Freeze first N DiT layers (0 = none)

# Fine-tuning specific settings
finetune_mode: "full"          # Only full SFT is implemented; unsupported modes fail closed.

# ============================================================================
# Model Configuration (must match pretrained model)
# ============================================================================

model_preset: "small"  # nano, tiny, small, medium, large, or xlarge; must match the parent
dacvae_model: "facebook/dacvae-watermarked"  # Must exactly match the parent/data contract.
dacvae_revision: "8680102d141858a21bd533543966a2eb2e569f92"
dacvae_sha256: "573cf4770ea4a25507f26965d05ae720bcd34295a9f60c06ef3c3805826b68e4"
dacvae_backend: "bundled"  # Exact resolved backend: "bundled" or "fast".
dacvae_latent_dim: 128
dacvae_sample_rate: 44100
dacvae_hop_length: 512

text_conditioning_mode: "frozen_features"
conditioning_feature_size: 768
conditioning_feature_dtype: "float16"
text_vocab_size: 1969
pad_token: 1
frozen_text_encoder_id: "vinai/xphonebert-base"
frozen_text_encoder_revision: "cf2bc63858dec1c03880fa8f764fe2195accb1ab"
frozen_text_config_sha256: "afe941f5c081c7b940cdac3458d7caba32c12b14d394834c236c62dcfa5c0a34"
frozen_text_model_filename: "pytorch_model.bin"
frozen_text_model_sha256: "3fd746d1348ceff1f7155ae12f06b841bc28f5d83fd6b6eeee640e7177555463"
frozen_text_tokenizer_id: "vinai/xphonebert-base"
frozen_text_tokenizer_revision: "cf2bc63858dec1c03880fa8f764fe2195accb1ab"
frozen_text_tokenizer_filename: "tokenizer.json"
frozen_text_tokenizer_sha256: "15d43733d44b25d9b3637647c7b790b3ff7346515656d894c8ba7904f5ca33fe"
frozen_text_hidden_layer: -1
frozen_text_frontend: "phonemes"
frozen_text_alignment: "hf_non_special_tokens_v1"
frozen_text_cache_version: 1
target_patch_size: 2  # Must match the parent; packing happens outside immutable DACVAE.

speaker_patch_size: 4  # Must match the value stored by the parent checkpoint
speaker_num_summary_tokens: 8  # Must exactly match the parent checkpoint topology.
# speaker_id is pairing/split metadata only. Training dynamically selects another cached
# same-speaker utterance as reference audio; inference accepts an unseen speaker recording.
use_speaker_conditioning: true
initialize_speaker_conditioning: false  # Set true when adding it to a text-only checkpoint
reference_seed: 1337
min_reference_seconds: 3.0
short_reference_max_seconds: 8.0
max_reference_seconds: 12.0
short_reference_probability: 0.8
dynamic_reference_strict: true

use_language_conditioning: true  # Preserve the parent checkpoint's language topology.
initialize_language_conditioning: false  # Set true when adding languages to monolingual weights
supported_languages: ["en"]  # Must match training rows and checkpoint metadata
# Exact [target, reference] pairs; preflight and inference reject undeclared combinations.
supported_language_pairs: [["en", "en"]]  # Edit only to match the pretrained parent.
initialize_cross_lingual_capability: false  # Add metadata only while training matching rows
freeze_language_embedding: false

# Versioned duration prediction is opt-in. Set initialize_duration_predictor: true only
# when adding a newly trained head to a legacy/pre-v2 pretrained checkpoint.
use_duration_predictor: true
initialize_duration_predictor: false
duration_predictor_hidden_size: 256
duration_predictor_num_layers: 2
duration_predictor_use_speaker: true
duration_loss_weight: 0.1
duration_huber_delta: 1.0
# These architecture fields match the canonical scratch pretraining export. Change them only when
# the selected parent lineage was produced by a deliberately different pretraining configuration.
use_mas_duration: true
duration_alignment_hidden_size: 64
mas_duration_loss_weight: 0.1
mas_alignment_loss_weight: 0.01

norm_eps: 1.0e-6
generative_objective: "vp_diffusion_v"
diffusion_schedule_shift: 1.0
cfg_dropout: 0.1           # Default text/speaker conditioning dropout probability
cfg_dropout_text: null     # Optional text-specific override; null inherits cfg_dropout
cfg_dropout_speaker: null  # Optional speaker-specific override; null inherits cfg_dropout

# ============================================================================
# Fine-tuning Training Configuration
# ============================================================================

epochs: 100
batch_size: 4  # Per-device; measure and tune on the target GPU.
# Variable-size batches cap total unpadded DACVAE frames before collation.
# 4096 supports every <=30 s sample from the default ~86 Hz preparation path.
max_frames_per_batch: 4096
max_examples_per_batch: null  # null uses batch_size as the example-count ceiling.
frame_bucket_size: 128
batching_cost: "padded_attention"
max_attention_cost_per_batch: 24000000  # Tune from measured server memory/throughput.
allow_legacy_frame_length_inference: false  # Re-prepare old data instead of loading every latent.
allow_legacy_representation: false  # Require the pretraining codec/frontend contract.
learning_rate: 1.0e-5
weight_decay: 0.01
warmup_steps: 0
warmup_ratio: 0.05
gradient_accumulation_steps: 4  # Effective global batch = 4 x 4 x world_size.
ddp_bucket_cap_mb: 25
ddp_find_unused_parameters: false  # Unreachable legacy prefix parameters stay frozen.
max_grad_norm: 0.5
save_steps: 1000
logging_steps: 10

# Learning rate schedule
lr_scheduler_type: "cosine"

# ============================================================================
# Dataset (Local prepared dataset only)
# ============================================================================

TTS_dataset_local: "./finetune_data"  # Prepared data with nar_vae_dataset_manifest.json.
# For zero-shot cloning, keep training/validation/test speakers disjoint and
# prepare same-speaker references that always differ from the target utterance.

# ============================================================================
# Paths and Naming
# ============================================================================

save_folder: "checkpoints/nar_vae_sft"
project_name: "nar-vae-sft"
run_name: "nar-vae-sft"

# ============================================================================
# Optional Hardware Optimizations
# ============================================================================

use_fsdp: false  # Unsupported by this entry point; use DDP via torchrun.
mixed_precision: "bf16"  # Set fp32 when BF16 is not suitable for the server GPU.
tf32: false  # Optional; enable only after numerical-parity checks.
gradient_checkpointing: true  # Optional memory/compute tradeoff; non-reentrant when enabled.
torch_compile: false  # Optional; enable only after numerical and shape-bucket validation.
dataloader_num_workers: 4
dataloader_pin_memory: true
dataloader_drop_last: true
dataloader_persistent_workers: true
dataloader_prefetch_factor: 2

# ============================================================================
# Validation
# ============================================================================

# Generated-audio validation is not implemented inside the Trainer entry point.
# Keep this false; run explicit held-out evaluation on each exported checkpoint.
do_validation: false

# ============================================================================
# Diffusion objective weighting
# ============================================================================

flow_velocity_weighted: false

# ============================================================================
# EMA (Exponential Moving Average) - Recommended for fine-tuning
# ============================================================================

use_ema: true
ema_decay: 0.9999
ema_update_every: 10

# ============================================================================
# Optimizer and Mandatory Experiment Tracking
# ============================================================================

optimizer: "adamw"  # Or experimental "muon"; AdamW remains the default.
adam_beta1: 0.9
adam_beta2: 0.999
adam_epsilon: 1.0e-8
# Uncomment these only together with optimizer: "muon".
# muon_learning_rate: 1.0e-5  # Omit to reuse learning_rate.
# muon_weight_decay: 0.01     # Omit to reuse weight_decay.
# muon_momentum: 0.95
# muon_nesterov: true
# muon_ns_steps: 5
# muon_epsilon: 1.0e-7
# muon_adjust_lr_fn: "match_rms_adamw"
report_to: "wandb"  # Mandatory; W&B logging is rank-zero-safe under DDP.
logging_dir: "./logs"
logging_first_step: true
save_total_limit: 3
save_safetensors: false
wandb_project: "nar-vae-sft"
wandb_run_name: "nar-vae-sft"
wandb_log_model: false
