[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nar-vae"
dynamic = ["version"]
description = "Low-cost non-autoregressive diffusion and flow-matching text-to-speech toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "NAR-VAE Contributors", email = "kadir.nar@hotmail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "accelerate>=1.3,<2",
    "build",
    "cache-dit>=1.5,<2",
    "datasets==3.4.1",
    "descript-audiotools>=0.7.2",
    "tiktoken",
    "einops",
    "huggingface-hub",
    "kernels>=0.16,<0.17",
    "librosa",
    "numpy",
    # Prevent legacy numba releases, which cannot install on supported Python versions.
    "numba>=0.60",
    "PyYAML",
    "ruff",
    "soundfile",
    "torch>=2.7.1",
    "torchaudio>=2.7.1",
    "torchcodec",
    "tqdm",
    "tomli>=2.0; python_version < '3.11'",
    "transformers>=4.49,<5",
    "wandb",
]

[project.urls]
Homepage = "https://github.com/kadirnar/nar-vae"
Repository = "https://github.com/kadirnar/nar-vae"
Issues = "https://github.com/kadirnar/nar-vae/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = { attr = "nar_vae._version.__version__" }

[tool.setuptools.packages.find]
include = ["nar_vae*"]

[tool.setuptools.package-data]
nar_vae = ["configs/*.yaml", "configs/*.toml"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
